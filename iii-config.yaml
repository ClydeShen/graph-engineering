workers:
  - name: iii-worker-manager
    config:
      port: 4001

  - name: iii-cron
    config:
      adapter:
        name: kv

  - name: iii-observability
    config:
      enabled: true
      exporter: memory
      logs_enabled: true
      logs_console_output: true
      sampling_ratio: 0.1   # ADR agentmemory issue #519: full sampling caused 137 GB log loop

  - name: iii-queue
    config:
      adapter:
        name: builtin        # required for durable:subscriber topic routing

  - name: iii-pubsub
    config:
      adapter:
        name: local          # required for durable:subscriber delivery

  - name: iii-state
    config:
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: .iii-state   # persistent KV for trigger registration

